<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="WhOLLiN 딱 1분만 런 — 도깨비와 함께 1분 동안 달리는 미니게임">
<meta property="og:title" content="딱 1분만 런">
<meta property="og:description" content="꼬깔은 넘고, 도깨비불은 모으고, 1분 뒤 깃발까지!">
<style>:root{color-scheme:dark}body{margin:0}img{max-width:100%}</style>
<title>딱 1분만 런</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;800&display=swap">
<style>
/* Layout: 앨범 속지처럼 파란 바탕 한 장, 주황 지평선 위를 흰 도깨비가 달림. 앨범 룩 그대로 단일 테마 */
:root{
  --blue:#294495;     /* 앨범 바탕 */
  --blue-deep:#21397f;
  --orange:#e16925;   /* 지평선·크레딧 컬러 */
  --white:#ffffff;
  --soft:#b9c4ea;     /* 보조 글자 */
  --display:"Black Han Sans","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;background:var(--blue);color:var(--white);font-family:var(--body);font-weight:500;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 32px;
  display:flex;flex-direction:column;align-items:center;gap:16px}
header{width:100%;max-width:960px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header img{height:30px;width:auto;display:block}
.best{font-family:var(--display);color:var(--orange);font-size:16px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stage{width:100%;max-width:960px}
canvas{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
canvas:focus{outline:none}
.help{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;font-size:14px;color:var(--soft)}
kbd{font-family:var(--body);font-weight:800;font-size:11px;color:var(--white);border:1.5px solid var(--soft);border-radius:5px;padding:2px 6px}
.touch{display:none}
@media (pointer:coarse){.pc{display:none}.touch{display:inline}}
.share{font-family:var(--display);font-size:17px;color:var(--blue);background:var(--orange);text-decoration:none;
  padding:9px 16px;border-radius:999px}
.share:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.share[aria-disabled="true"]{background:transparent;color:var(--soft);box-shadow:inset 0 0 0 1.5px var(--soft);pointer-events:none}
</style>
</head>

const cv=document.getElementById('game'), g=cv.getContext('2d');
let W=900; const H=300, GROUND=244, GOAL_SEC=60;

function fit(){
  const cw=cv.parentElement.clientWidth||900;
  W = cw<560 ? 560 : 900;                      // 폰에서는 화면을 좁게 잡아 캐릭터가 크게 보이게
  const dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
}
fit(); addEventListener('resize',()=>{fit();draw();});

/* 저장 */
let best=0; try{best=+localStorage.getItem('ddak1-best')||0}catch(e){}
const bestEl=document.getElementById('best'), shareEl=document.getElementById('share');
bestEl.textContent='BEST '+best;

/* 상태 */
let phase=0, state='ready', speed, dist, score, time, obs, items, pops, bonus, gap, frame, puffs, flag, cleared, clearT, pinX;
const P={x:70,y:GROUND,vy:0,hold:false,ground:true};
function reset(){
  speed=8; dist=0; score=0; time=0; obs=[]; items=[]; pops=[]; bonus=0; gap=520; frame=0; puffs=[];
  flag=null; cleared=false; clearT=0; pinX=150;
  Object.assign(P,{y:GROUND,vy:0,ground:true});
}
reset();

function jump(){
  if(state==='ready'||state==='over'){ reset(); state='run'; return; }
  if(P.ground) doJump(); else buffer=9;   // 착지 직전에 눌러도 착지하자마자 뜀
}
let buffer=0;
function doJump(){ P.vy=-12.5; P.ground=false; buffer=0; }

function spawn(){
  const lvl=Math.min(3,Math.floor(time/20));          // 20초마다 장애물 조합이 늘어남
  const r=Math.random(), x=W+20;
  let topH;                                            // 장애물 중 가장 높은 꼬깔
  if(r<0.35){ obs.push({k:'cone',x,w:26,h:32}); topH=32; }
  else if(r<0.65 || lvl<1){ obs.push({k:'cone',x,w:30,h:42}); topH=42; }
  else if(r<0.8){ obs.push({k:'cone',x,w:34,h:56}); topH=56; }
  else { obs.push({k:'cone',x,w:26,h:32}); obs.push({k:'cone',x:x+28,w:30,h:42}); topH=42;
         if(lvl>=2) obs.push({k:'cone',x:x+58,w:26,h:32}); }
  gap = 300 + Math.random()*260 + speed*16;
  // 가산점 아이템(도깨비불): 꼬깔 위 또는 꼬깔 사이 길 위
  const q=Math.random();
  if(q<0.35) items.push({x:x+8, y:GROUND-topH-62, v:30});               // 꼬깔 위: 점프하면서 먹기
  else if(q<0.65) items.push({x:x+gap*0.5, y:GROUND-28, v:20});         // 땅 위: 달리면서 먹기
  else if(q<0.8) items.push({x:x+gap*0.5, y:GROUND-118, v:30});         // 공중: 길게 눌러 높이 뛰어야 먹기
}

/* 업데이트 */
function update(k){
  frame+=k;
  if(state!=='run'){ return; }
  time+=k/60;
  if(buffer>0) buffer-=k;
  if(P.ground) phase += (0.13 + speed*0.008)*k;
  speed=Math.min(18, 8 + time*0.12);
  const dx=speed*k; dist+=dx; score+=dx*0.05; pinX-=dx;

  if(!P.ground){
    P.vy += ((P.hold&&P.vy<-4)?0.65:1.0)*k; P.y += P.vy*k;
    if(P.y>=GROUND){P.y=GROUND;P.vy=0;P.ground=true;addPuff(4); if(buffer>0) doJump();}
  } else if(Math.floor(frame)%7===0) addPuff(1);

  // 1분 지점 깃발: 직전 2초는 길을 비워둠
  const flagSoon = !cleared && !flag && time > GOAL_SEC-2;
  if(flagSoon){ flag={x:W+40}; }
  if(!flagSoon && !(flag && flag.x>P.x-40)){ gap-=dx; if(gap<=0) spawn(); }
  if(flag){ flag.x-=dx;
    if(!cleared && flag.x<P.x+20){ cleared=true; clearT=150; score+=100; }
    if(flag.x<-80) flag=null; }
  if(clearT>0) clearT-=k;

  obs.forEach(o=>o.x-=dx); obs=obs.filter(o=>o.x>-80);
  items.forEach(it=>it.x-=dx); items=items.filter(it=>it.x>-60&&!it.got);
  pops.forEach(p=>{p.x-=dx*0.3; p.y-=0.8*k; p.t-=k;}); pops=pops.filter(p=>p.t>0);
  puffs.forEach(p=>{p.x-=dx*0.6+p.vx*k;p.y+=p.vy*k;p.r-=0.12*k;}); puffs=puffs.filter(p=>p.r>0.5);

  // 충돌 (그림보다 살짝 작게 잡아 억울하지 않게)
  const box={x:P.x+14,y:P.y-66,w:46,h:60};
  for(const o of obs){
    const ox=o.x+4, oy=GROUND-o.h+4, ow=o.w-8, oh=o.h-4;
    if(box.x<ox+ow&&box.x+box.w>ox&&box.y<oy+oh&&box.y+box.h>oy){ die(); return; }
  }
  // 아이템 먹기 (판정은 넉넉하게)
  for(const it of items){
    const ix=it.x-4, iy=it.y-22, iw=34, ih=38;
    if(box.x<ix+iw&&box.x+box.w>ix&&box.y<iy+ih&&box.y+box.h>iy){
      it.got=true; score+=it.v; bonus+=it.v; pops.push({x:it.x+13,y:it.y-10,v:it.v,t:40});
    }
  }
}
function addPuff(n){ for(let i=0;i<n;i++) puffs.push({x:P.x+16,y:GROUND-4,vx:Math.random()*1.5,vy:-Math.random()*0.8,r:3+Math.random()*3}); }

function die(){
  state='over';
  const s=Math.floor(score);
  if(s>best){best=s;try{localStorage.setItem('ddak1-best',best)}catch(e){} bestEl.textContent='BEST '+best;}
  const line = cleared ? `딱 1분만 완주하고 ${s}점까지 달렸어!` : `딱 1분만 런 ${s}점! 1분 완주는 아직…`;
  shareEl.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(line+' #홀린 #WhOLLiN #딱1분만');
  shareEl.setAttribute('aria-disabled','false');
}

/* 그리기 */
function draw(){
  g.fillStyle=C.blue; g.fillRect(0,0,W,H);
  // 지평선
  g.fillStyle=C.orange; g.fillRect(0,GROUND-2,W,6);
  g.fillStyle=C.deep;
  for(let i=0;i<14;i++){ const x=((i*97-dist*1)%(W+40)+W+40)%(W+40)-20; g.fillRect(x,GROUND+16+(i*13)%30,10+(i%3)*8,3); }

  // 출발 핀
  if(pinX>-60) drawPin(pinX, GROUND-12);
  if(flag) drawFlag(flag.x);
  obs.forEach(drawObs);
  items.forEach(drawItem);
  pops.forEach(drawPop);

  // 먼지
  g.fillStyle=C.orange; puffs.forEach(p=>{g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();});

  drawDokkaebi();
  hud();

  if(state==='ready') readyScreen();
  if(state==='over') overScreen();
  if(clearT>0 && state==='run') clearBanner();
}

function drawDokkaebi(){
  const ok=IMG.run.complete&&IMG.run.naturalWidth;
  if(state==='ready'){
    const h=82,w=h*IMG.stand.naturalWidth/IMG.stand.naturalHeight||52;
    if(IMG.stand.complete) g.drawImage(IMG.stand,P.x+8,GROUND-h-1+Math.sin(frame*0.08)*1.5,w,h);
    return;
  }
  // 원본 이미지 그대로, 통통 튀는 걸음으로 달리는 느낌
  const h=84, w=h*(IMG.run.naturalWidth/IMG.run.naturalHeight||0.95);
  g.save();
  g.translate(P.x+w/2, P.y);
  if(state==='over'){ g.translate(0,-h/2); g.rotate(-1.35); g.translate(0,h/2+10); }
  else if(!P.ground){ g.rotate(Math.max(-0.3,Math.min(0.2,P.vy*0.02))); }
  else {
    const c=Math.abs(Math.sin(phase));          // 0 = 발 디딤, 1 = 공중
    const sq = c<0.25 ? (0.25-c)*0.32 : 0;       // 디딜 때 살짝 눌림
    g.translate(0,-c*7); g.rotate(Math.sin(phase*2)*0.04); g.scale(1+sq,1-sq);
  }
  if(ok) g.drawImage(IMG.run,-w/2,-h,w,h);
  g.restore();
}

function drawObs(o){
  const x=o.x, y=GROUND-o.h;
  if(o.k==='cone'){
    g.fillStyle=C.orange; g.beginPath(); g.moveTo(x+o.w/2,y); g.lineTo(x+o.w,GROUND); g.lineTo(x,GROUND); g.closePath(); g.fill();
    g.fillStyle=C.white; g.fillRect(x+o.w*0.3,y+o.h*0.45,o.w*0.4,5);
    return;
  }
}
function drawItem(it){
  // 도깨비불: 흔들리는 흰 불꽃 + 주황 심지
  const t=frame*0.15+it.x*0.05, b=Math.sin(t*0.8)*4, cx=it.x+13, cy=it.y+b;
  const sway=Math.sin(t)*5, tall=26+Math.sin(t*1.7)*3;
  g.fillStyle=C.white; g.globalAlpha=0.16; g.beginPath(); g.arc(cx,cy-6,22,0,7); g.fill(); g.globalAlpha=1;
  g.fillStyle=C.white; g.beginPath();
  g.moveTo(cx+sway,cy-tall);
  g.bezierCurveTo(cx+6+sway*0.5,cy-14, cx+13,cy-8, cx+12,cy+1);
  g.arc(cx,cy+1,12,0,Math.PI);
  g.bezierCurveTo(cx-13,cy-8, cx-6+sway*0.5,cy-14, cx+sway,cy-tall);
  g.fill();
  g.fillStyle=C.orange; g.beginPath();
  g.moveTo(cx+sway*0.4,cy-10); g.quadraticCurveTo(cx+6,cy-2,cx+5,cy+3); g.arc(cx,cy+3,5,0,Math.PI); g.quadraticCurveTo(cx-6,cy-2,cx+sway*0.4,cy-10); g.fill();
}
function drawPop(p){
  g.globalAlpha=Math.min(1,p.t/20); g.fillStyle=C.orange; g.textAlign='center';
  g.font='20px "Black Han Sans", sans-serif'; g.fillText('+'+p.v,p.x,p.y); g.globalAlpha=1;
}
function drawPin(x,y){
  g.fillStyle=C.white; g.beginPath(); g.arc(x,y-34,16,Math.PI*0.85,Math.PI*2.15); g.lineTo(x,y); g.closePath(); g.fill();
  g.fillStyle=C.blue; g.beginPath(); g.arc(x,y-34,6,0,7); g.fill();
}
function drawFlag(x){
  g.fillStyle=C.orange; g.fillRect(x,GROUND-92,6,92);
  const w=Math.sin(frame*0.2)*4;
  g.beginPath(); g.moveTo(x+6,GROUND-92); g.quadraticCurveTo(x+30,GROUND-86+w,x+56,GROUND-80); g.lineTo(x+6,GROUND-62); g.closePath(); g.fill();
}
function round(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function hud(){
  if(state==='ready') return;
  g.textBaseline='alphabetic';
  // 남은 1분
  const left=Math.max(0,GOAL_SEC-time);
  g.font='20px "Black Han Sans", sans-serif'; g.textAlign='left'; g.fillStyle=C.orange;
  g.fillText(cleared ? 'STILL RUNNING +'+mmss(time-GOAL_SEC) : '딱 1분만  '+mmss(left), 20, 36);
  // 진행 바
  if(!cleared){ g.fillStyle=C.deep; g.fillRect(20,46,160,4); g.fillStyle=C.orange; g.fillRect(20,46,160*Math.min(1,time/GOAL_SEC),4); }
  g.textAlign='right'; g.fillStyle=C.white; g.font='26px "Black Han Sans", sans-serif';
  g.fillText(String(Math.floor(score)).padStart(5,'0'), W-20, 38);
}
const mmss=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

function logo(img,cy,maxW){
  if(!img.complete||!img.naturalWidth) return;
  const w=Math.min(maxW,W*0.6), h=w*img.naturalHeight/img.naturalWidth; g.drawImage(img,(W-w)/2,cy-h/2,w,h);
}
function readyScreen(){
  const n=W<700;                       // 폰: 로고를 조금 올리고 문구를 캐릭터 위로
  logo(IMG.title,n?64:92,n?240:340);
  g.textAlign='center'; g.fillStyle=C.white; g.font=(n?16:18)+'px "Black Han Sans", sans-serif';
  g.fillText('꼬깔은 넘고, 도깨비불은 모으고, 1분 뒤 깃발까지!',W/2,n?136:172);
  g.fillStyle=C.orange; g.fillText(n?'화면을 탭해서 출발':'탭 또는 SPACE로 출발',W/2,n?160:200);
}
function overScreen(){
  g.textAlign='center';
  g.fillStyle=C.orange; g.font='34px "Black Han Sans", sans-serif'; g.fillText(cleared?'완주 성공!':'꽈당!',W/2,96);
  g.fillStyle=C.white; g.font='20px "Black Han Sans", sans-serif';
  g.fillText(`${Math.floor(score)}점 (보너스 +${bonus}) · 최고 ${best}점`,W/2,132);
  g.fillStyle=C.soft; g.font='16px "Gothic A1", sans-serif';
  g.fillText('탭 또는 SPACE로 다시 달리기',W/2,162);
}
function clearBanner(){
  const a=Math.min(1,clearT/30);
  g.globalAlpha=a; logo(IMG.swy,104,360);
  g.textAlign='center'; g.fillStyle=C.orange; g.font='20px "Black Han Sans", sans-serif';
  g.fillText('딱 1분 완주! +100',W/2,160); g.globalAlpha=1;
}

/* 루프 */
let last=performance.now();
function loop(now){ const k=Math.min(3,(now-last)/16.667); last=now; update(k); draw(); requestAnimationFrame(loop); }
Promise.all([document.fonts?.ready, ...Object.values(IMG).map(i=>i.decode?.().catch(()=>{}))]).then(draw);
requestAnimationFrame(loop);

/* 입력: 버튼 하나로 끝나는 게임 */
const isJump=e=>['Space','ArrowUp','KeyW'].includes(e.code);
addEventListener('keydown',e=>{ if(isJump(e)){ e.preventDefault(); if(!e.repeat) jump(); P.hold=true; } });
addEventListener('keyup',e=>{ if(isJump(e)) P.hold=false; });
// 캔버스뿐 아니라 화면 어디를 눌러도 점프 (공유 버튼 제외)
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('a')) return;
  e.preventDefault(); try{cv.focus({preventScroll:true})}catch(_){}
  jump(); P.hold=true;
});
try{cv.focus({preventScroll:true})}catch(_){}
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,()=>P.hold=false));
})();
</script>
